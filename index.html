<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 ZenMC Tiers - SA Rankings Dinámicos</title>
    <style>
        /* Variables basadas en la estética de MCTiers (Azul Oscuro/Teal/Lima) */
        :root {
            --bg-color: #0d121c; 
            --main-text-color: #e0e0f0;
            --dark-panel-bg: #1c2533; 
            --dark-border: #334054; 
            --logo-color: #79d2a4; /* Verde Lima/Teal para acentos */
            --rank-gold: #fbc02d; 
            --rank-silver: #a0a0a0;
            --rank-bronze: #c67c2d; 
            --tier-high-color-bg: #4e342e; /* HT - Marrón oscuro */
            --tier-low-color-bg: #2e3b5e;  /* LT - Azul oscuro */
            --tier-label-text: #fff;
            --hover-color: #243040; /* Fila en hover */
            --active-mode-border: #79d2a4; /* Borde activo (Lima) */
            --player-subtext-color: #999;
            --points-color: #bdbdbd; /* Gris claro para los puntos */
            --combat-badge-bg: #2e3b5e;
            --modal-bg: #1f2a3a; /* Fondo del modal */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* --- Barra de Navegación (Header) --- */
        .navbar {
            background-color: var(--dark-panel-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--logo-color);
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(121, 210, 164, 0.5); 
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--main-text-color);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .search-input {
            padding: 8px 10px; 
            border-radius: 4px; 
            border: 1px solid var(--dark-border); 
            background: #243040; 
            color: white;
        }

        /* --- Selector de Modos (Barra de botones) --- */
        .mode-bar {
            background-color: var(--bg-color); 
            padding: 15px 0; 
            margin-top: 20px;
            display: flex;
            gap: 15px; 
            overflow-x: auto;
            justify-content: flex-start;
            border-bottom: 1px solid var(--dark-border);
        }

        .mode-btn {
            background-color: transparent; 
            color: #999;
            border: none;
            padding: 10px 0;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.2s, border-bottom 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .mode-btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--dark-panel-bg);
            border: 1px solid transparent;
            overflow: hidden;
            padding: 4px;
        }
        
        .mode-btn.active {
            color: var(--active-mode-border); 
            border-bottom: 3px solid var(--active-mode-border); 
        }

        .mode-btn.active .mode-btn-icon {
            border: 1px solid var(--active-mode-border);
            box-shadow: 0 0 5px rgba(121, 210, 164, 0.5);
        }

        /* --- Tabla de la Tier List --- */
        .tier-table {
            background-color: var(--dark-panel-bg);
            margin-top: 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--dark-border);
        }

        .tier-header, .tier-row {
            display: grid;
            /* Columnas ajustadas: Rank (60px), Player (2.2fr), Region (70px), Tiers (3fr) */
            grid-template-columns: 60px 2.2fr 70px 3fr; 
            padding: 15px 20px;
            align-items: center;
            border-bottom: 1px solid var(--dark-border);
            font-size: 0.95em;
            transition: background-color 0.2s;
            cursor: pointer; /* Indica que la fila es clickeable */
        }
        
        .tier-row:hover {
            background-color: var(--hover-color);
        }
        
        .tier-header {
            background-color: #243040; 
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            color: #ccc;
            letter-spacing: 0.5px;
            padding: 12px 20px;
            border-bottom: 2px solid var(--dark-border);
        }

        /* Rank Badge Style */
        .rank-badge {
            font-size: 1.1em;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .rank-number {
            min-width: 40px; 
            text-align: center;
            padding: 5px 8px;
            border-radius: 4px;
            line-height: 1;
            font-size: 1.2em;
        }
        
        /* Colores de Top Ranks */
        .rank-1 .rank-number { 
            background-color: var(--rank-gold); 
            color: #333; 
        }
        .rank-2 .rank-number { 
            background-color: var(--rank-silver); 
            color: #333; 
        }
        .rank-3 .rank-number { 
            background-color: var(--rank-bronze); 
            color: #fff; 
        }
        
        /* Estilos para el nombre de jugador y subtexto */
        .player-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px; 
            font-weight: 600;
            line-height: 1.2;
        }
        
        .player-name-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-subtext {
            font-size: 0.8em;
            font-weight: 500;
            color: var(--player-subtext-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .combat-badge {
            background-color: var(--combat-badge-bg);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .points-text {
            color: var(--points-color);
        }
        
        .skin-icon {
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            border: 2px solid var(--logo-color); 
            object-fit: cover;
        }

        /* Tiers List en la Tabla */
        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px; 
            justify-content: flex-start; 
        }

        .tier-item-badge {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 2px; 
            padding: 5px 3px;
        }
        
        .icon-circle {
            width: 28px; 
            height: 28px;
            border-radius: 50%;
            background-color: #343460; 
            border: 1px solid #4e5e7e; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }
        
        .image-icon-img {
            width: 90%; 
            height: 90%; 
            object-fit: contain; 
            display: block; 
        }
        
        .tier-label {
            font-size: 0.65em; 
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 2px;
            color: var(--tier-label-text); 
            min-width: 30px; 
            text-align: center;
        }
        
        .tier-ht .tier-label { background-color: var(--tier-high-color-bg); } 
        .tier-lt .tier-label { background-color: var(--tier-low-color-bg); }  

        /* --- MODAL DE PERFIL --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--modal-bg);
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.9);
            position: relative;
            text-align: center;
        }
        
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
        }
        
        .modal-player-skin {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--logo-color);
            margin-bottom: 10px;
        }
        
        .modal-player-name {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--main-text-color);
            margin-bottom: 5px;
        }
        
        .modal-combat-rank {
            padding: 5px 10px;
            border-radius: 20px;
            background-color: var(--rank-gold);
            color: #333;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .modal-position-box {
            background-color: var(--dark-panel-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .modal-rank-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--rank-gold);
        }
        
        .modal-overall-info {
            text-align: left;
        }
        
        .modal-overall-title {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--logo-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .modal-overall-points {
            font-size: 1em;
            color: var(--points-color);
        }
        
        .modal-tiers-section {
            text-align: left;
        }
        
        .modal-tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        
    </style>
</head>

    <script>
        // --- CONFIGURACIÓN DE DATOS ---
        const TIER_RANKING = {
            'HT1': 12, 'LT1': 11, 'HT2': 10, 'LT2': 9,
            'HT3': 8, 'LT3': 7, 'HT4': 6, 'LT4': 5,
            'HT5': 4, 'LT5': 3, 'Default': 1
        };
        
        // PUNTOS BASE: Cada Tier vale 60 puntos menos que el anterior. HT1 es el mejor.
        const TIER_POINTS = {
            'HT1': 600, 'LT1': 540, 'HT2': 480, 'LT2': 420,
            'HT3': 360, 'LT3': 300, 'HT4': 240, 'LT4': 180,
            'HT5': 120, 'LT5': 60, 'Default': 0
        };

        const MODE_ICONS = {
            'Overall': { icon: '🏆', class: 'overall-icon-badge' },
            'Sword': { icon: '⚔️', class: 'sword-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Wooden_Sword_JE2_BE2.png?065ee&format=original" },
            'NetPot': { icon: '🧪', class: 'netpot-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Brewing_Stand.png?26027" },
            'CristalPvP': { icon: '💎', class: 'cristal-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Invicon_End_Crystal.gif?8decb" },
            'Mace': { icon: '🔨', class: 'mace-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Mace.png?1e793" },
            'SMP': { icon: '❤️', class: 'smp-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Heart_%28full%29.png?f47c9" },
        };

        // --- LÓGICA PRINCIPAL ---
        const tierListBody = document.getElementById('tier-list-body');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const tierRows = document.querySelectorAll('.tier-row');
        
        function getTierScore(tierString) {
            return TIER_RANKING[tierString] || TIER_RANKING['Default'];
        }

        function getTierPoints(tierString) {
            return TIER_POINTS[tierString] || TIER_POINTS['Default'];
        }
        
        function getTierClass(tier) {
            const prefix = tier.substring(0, 2);
            if (prefix === 'HT') return 'tier-ht';
            if (prefix === 'LT') return 'tier-lt';
            return '';
        }
        
        function getCombatRank(points) {
            if (points >= 600) return 'Combat Grandmaster';
            if (points >= 400) return 'Combat Master';
            if (points >= 200) return 'Combat Expert';
            return 'Combat Recruit';
        }

        // Calcula el puntaje total del jugador sumando los puntos de todos sus tiers.
        function calculateOverallPoints(tiersData) {
            const tiers = tiersData.split(',');
            let totalPoints = 0;
            tiers.forEach(tierEntry => {
                const parts = tierEntry.split(':');
                if (parts.length > 1) {
                     const tier = parts[1];
                     totalPoints += getTierPoints(tier);
                }
            });
            return totalPoints;
        }

        // Crea el HTML para un badge de Tier
        function createTierBadge(modeName, tier) {
            const iconData = MODE_ICONS[modeName] || { icon: '❓', class: '' };
            const tierClass = getTierClass(tier);

            const item = document.createElement('div');
            item.className = `tier-item-badge ${tierClass}`;
            
            let iconHTML;
            if (iconData.isImage && iconData.url) {
                iconHTML = `<img src="${iconData.url}" alt="${modeName} Icon" class="image-icon-img">`;
            } else {
                iconHTML = `<span class="mode-icon ${iconData.class}">${iconData.icon}</span>`;
            }

            item.innerHTML = `
                <div class="icon-circle">${iconHTML}</div>
                <span class="tier-label">${tier}</span>
            `;
            return item;
        }

        function filterAndSort(selectedMode) {
            
            modeButtons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`[data-mode="${selectedMode}"]`);
            if (activeBtn) {
                 activeBtn.classList.add('active');
            }


            let activeRows = [];
            
            tierRows.forEach(row => {
                const tiersData = row.getAttribute('data-mode-tiers');
                const points = calculateOverallPoints(tiersData);
                const playerName = row.getAttribute('data-player-name');

                // Actualiza el subtexto (Puntos y Rango de Combate)
                document.getElementById(`${playerName}-points`).textContent = points;
                document.getElementById(`${playerName}-rank`).textContent = getCombatRank(points);

                // Determina la relevancia y el score para la ordenación
                let sortScore = 0;
                let isRelevant = false;

                if (selectedMode === 'Overall') {
                    sortScore = points; // Ordenamos por puntos totales
                    isRelevant = points > 0;
                } else {
                    sortScore = 0; // Se ordenará por rank del modo específico (score de TIER_RANKING)
                    const tiers = tiersData.split(',');
                    const modeEntry = tiers.find(e => e.includes(selectedMode));
                    if (modeEntry) {
                        const [, tier] = modeEntry.split(':');
                        sortScore = getTierScore(tier);
                        isRelevant = sortScore > 0;
                    }
                }
                
                if (isRelevant) {
                    row.classList.remove('hidden');
                    activeRows.push({
                        element: row,
                        score: sortScore 
                    });
                } else {
                    row.classList.add('hidden');
                }
                
                // --- Actualización de Tiers en la Fila ---
                const tiersListDiv = row.querySelector('.tiers-list');
                tiersListDiv.innerHTML = ''; 
                
                if (selectedMode !== 'Overall') {
                    // Muestra solo el tier de la modalidad activa
                    const tiers = tiersData.split(',');
                    const modeEntry = tiers.find(e => e.includes(selectedMode));
                    if (modeEntry) {
                        const [modeName, tier] = modeEntry.split(':');
                        if (tier && getTierScore(tier) > 0) {
                             tiersListDiv.appendChild(createTierBadge(modeName, tier));
                        }
                    }
                } else {
                    // Muestra todos los tiers, ordenados por score (mejor primero)
                    const tiers = tiersData.split(',').map(entry => {
                        const [modeName, tier] = entry.split(':');
                        return { modeName, tier: tier || 'Default', score: getTierScore(tier) };
                    });

                    const relevantTiers = tiers
                        .filter(e => e.score > 0)
                        .sort((a, b) => b.score - a.score); 

                    relevantTiers.forEach(entry => {
                        tiersListDiv.appendChild(createTierBadge(entry.modeName, entry.tier));
                    });
                }
            });

            // Ordena de forma descendente (el score/puntos más alto va primero)
            activeRows.sort((a, b) => b.score - a.score);

            let currentRank = 1;
            activeRows.forEach(item => {
                const row = item.element;
                
                let rankVisualElement = row.querySelector('.rank-number');
                rankVisualElement.textContent = `${currentRank}.`;
                
                row.classList.remove('rank-1', 'rank-2', 'rank-3');
                if (currentRank === 1) row.classList.add('rank-1');
                if (currentRank === 2) row.classList.add('rank-2');
                if (currentRank === 3) row.classList.add('rank-3');
                
                tierListBody.appendChild(row);
                currentRank++;
            });
        }
        
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                const mode = button.getAttribute('data-mode');
                filterAndSort(mode);
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            filterAndSort('Overall');
            
            // --- LÓGICA DEL MODAL ---
            tierRows.forEach(row => {
                row.addEventListener('click', () => {
                    const playerName = row.getAttribute('data-player-name');
                    const skinUrl = row.getAttribute('data-skin-url');
                    const region = row.getAttribute('data-region');
                    const tiersData = row.getAttribute('data-mode-tiers');
                    const rankNumber = row.querySelector('.rank-number').textContent;
                    const points = calculateOverallPoints(tiersData);
                    const combatRank = getCombatRank(points);
                    
                    document.getElementById('modalSkin').src = skinUrl;
                    document.getElementById('modalPlayerName').textContent = playerName;
                    document.getElementById('modalCombatRank').textContent = `🏆 ${combatRank}`;
                    document.getElementById('modalRegion').textContent = region;
                    document.getElementById('modalRankNumber').textContent = rankNumber.replace('.', '');
                    document.getElementById('modalOverallPoints').textContent = `(${points} points)`;
                    
                    const modalTiersList = document.getElementById('modalTiersList');
                    modalTiersList.innerHTML = '';
                    
                    // Mostrar todos los Tiers en el modal
                    const tiers = tiersData.split(',').map(entry => {
                        const [modeName, tier] = entry.split(':');
                        return { modeName, tier: tier || 'Default', score: getTierScore(tier) };
                    });
                    
                    const relevantTiers = tiers
                        .filter(e => e.score > 0)
                        .sort((a, b) => b.score - a.score); 

                    relevantTiers.forEach(entry => {
                        modalTiersList.appendChild(createTierBadge(entry.modeName, entry.tier));
                    });
                    
                    document.getElementById('playerModal').style.display = 'flex';
                });
            });
        });
        
        function closeModal() {
            document.getElementById('playerModal').style.display = 'none';
        }
    </script>
</body>
</html>
