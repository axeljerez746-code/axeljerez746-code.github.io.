<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 ZenMC Tiers - SA Rankings Dinámicos</title>
    <style>
        /* Variables y Estilos Generales ajustados para un look más "Gaming" oscuro */
        :root {
            --bg-color: #0d0d1a; /* Negro muy oscuro/Azul medianoche */
            --main-text-color: #e0e0f0; /* Texto Gris Claro */
            --dark-panel-bg: #1c1c36; /* Panel principal (un gris-morado oscuro) */
            --dark-border: #333355; /* Borde de separación */
            --logo-color: #d1b4ff; /* Morado Claro/Lila para el logo y acentos */
            --rank-gold: #ffc107; 
            --rank-silver: #a0a0a0;
            --rank-bronze: #cd7f32;
            --tier-high-color-bg: #b03a8d; /* HT - Morado/Rojo Oscuro */
            --tier-low-color-bg: #6c5ce7;  /* LT - Morado Azulado Intenso */
            --tier-label-text: #fff;
            --icon-circle-bg: #222244; 
            --active-mode-btn: #8e44ad; /* Morado de botón activo */
            --hover-color: #2a2a50; /* Color de hover para filas */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: var(--main-text-color);
            border-bottom: 2px solid var(--dark-border);
            padding-bottom: 10px;
        }

        /* --- Barra de Navegación (Header) --- */
        .navbar {
            background-color: var(--dark-panel-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--logo-color);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--main-text-color);
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-weight: 500;
        }
        
        #discord-link {
            color: var(--logo-color); /* Lila */
        }

        .nav-links a:hover {
            background-color: #444473;
        }

        /* Input de Búsqueda */
        .search-input {
            padding: 8px 10px; 
            border-radius: 4px; 
            border: 1px solid var(--dark-border); 
            background: #2b2b4d; 
            color: white;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-input:focus {
            border-color: var(--logo-color);
            box-shadow: 0 0 5px rgba(209, 180, 255, 0.5);
            outline: none;
        }

        /* --- Selector de Modos (Barra de botones) --- */
        .mode-bar {
            background-color: var(--dark-panel-bg);
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 8px;
            display: flex;
            gap: 8px; /* Reducimos el espacio entre botones */
            overflow-x: auto;
            justify-content: flex-start;
            border: 1px solid var(--dark-border);
        }

        .mode-btn {
            background-color: #3b3b6b; /* Un tono más oscuro que el panel */
            color: var(--main-text-color);
            border: none;
            padding: 8px 12px;
            border-radius: 4px; /* Ligeramente menos redondeado */
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .mode-btn:hover:not(.active) {
            background-color: #4a4a75;
        }

        .mode-btn.active {
            background-color: var(--active-mode-btn); 
            color: #fff;
            box-shadow: 0 2px 8px rgba(142, 68, 173, 0.5); 
        }

        /* --- Tabla de la Tier List --- */
        .tier-table {
            background-color: var(--dark-panel-bg);
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--dark-border);
        }

        .tier-header, .tier-row {
            display: grid;
            /* Columnas ajustadas: Rank (60px), Player (1.5fr), Region (70px), Tiers (2fr) */
            grid-template-columns: 60px 1.5fr 70px 2fr; 
            padding: 10px 20px;
            align-items: center;
            border-bottom: 1px solid var(--dark-border);
            font-size: 0.95em;
        }
        
        .tier-row.hidden {
            display: none; 
        }

        .tier-header {
            background-color: #222244; /* Header más oscuro */
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            color: #ccc;
            letter-spacing: 0.5px;
            padding: 12px 20px;
        }

        .tier-row:hover {
            background-color: var(--hover-color);
        }
        
        .tier-row:last-child {
            border-bottom: none;
        }

        /* Rank Badge Style */
        .rank-badge {
            font-size: 1.1em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        /* Contenedor del número de Rank */
        .rank-number {
            min-width: 25px; /* Asegura un ancho mínimo para el #10 */
            text-align: center;
            padding: 2px 5px;
            border-radius: 2px; /* Más cuadrado */
            line-height: 1;
        }
        
        /* Colores de Top Ranks */
        .rank-1 .rank-number { 
            background-color: var(--rank-gold); 
            color: #333; 
            font-size: 1.1em;
        }
        .rank-2 .rank-number { 
            background-color: var(--rank-silver); 
            color: #333; 
        }
        .rank-3 .rank-number { 
            background-color: var(--rank-bronze); 
            color: #fff; 
        }
        
        /* Estilos para el nombre de jugador */
        .player-info {
            display: flex;
            align-items: center; 
            gap: 10px; 
            font-weight: 600;
        }
        
        /* Estilo ÚNICO para el ícono del skin */
        .skin-icon {
            width: 32px; /* Reducido ligeramente */
            height: 32px; 
            border-radius: 50%; 
            border: 2px solid var(--logo-color); /* Borde lila */
            object-fit: cover;
        }

        /* Íconos de Tier List */
        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* Reducido el espacio entre badges */
            justify-content: flex-start; 
        }

        .tier-item-badge {
            display: flex;
            flex-direction: row; /* Coloca ícono y etiqueta en línea */
            align-items: center;
            gap: 5px; /* Espacio entre ícono y etiqueta */
            padding: 3px 6px 3px 3px;
            border-radius: 4px;
            background-color: #3b3b6b; /* Fondo sutil para el badge completo */
        }
        
        .icon-circle {
            width: 24px; /* Íconos más pequeños */
            height: 24px;
            border-radius: 50%;
            background-color: var(--icon-circle-bg); 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            /* Eliminamos el borde lila por defecto, solo lo aplicamos a la skin */
            border: none; 
        }
        
        /* Estilo para imágenes (ajuste para ocupar el círculo) */
        .image-icon-img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            border-radius: 0; /* Las imágenes no necesitan border-radius adicional si el contenedor es circular */
            display: block; 
        }

        /* Etiqueta de Tier (HT/LT) */
        .tier-label {
            font-size: 0.75em; /* Ligeramente más grande */
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            color: var(--tier-label-text); 
            min-width: 35px; /* Para mantener la uniformidad */
            text-align: center;
        }
        
        .tier-ht .tier-label { background-color: var(--tier-high-color-bg); } 
        .tier-lt .tier-label { background-color: var(--tier-low-color-bg); }  

    </style>
</head>

    <script>
        const TIER_RANKING = {
            'HT1': 12, 'LT1': 11,
            'HT2': 10, 'LT2': 9,
            'HT3': 8, 'LT3': 7, 
            'HT4': 6, 'LT4': 5,
            'HT5': 4, 'LT5': 3,
            'Overall': 2, 'Default': 1
        };
        
        // --- INFORMACIÓN DE ÍCONOS Y CONFIGURACIÓN DE IMÁGENES ---
        const MODE_ICONS = {
            'Overall': { icon: '⭐', class: 'overall-icon-badge' },
            'Sword': { 
                icon: '🗡️', 
                class: 'sword-icon-badge',
                isImage: true, 
                url: "https://minecraft.wiki/images/Wooden_Sword_JE2_BE2.png?065ee&format=original" 
            },
            'NetPot': { 
                icon: '🧪', 
                class: 'netpot-icon-badge',
                isImage: true,
                url: "https://minecraft.wiki/images/Enchanted_Netherite_Helmet_%28item%29.gif?0fb88&format=original"
            },
            'CristalPvP': { 
                icon: '💎', 
                class: 'cristal-icon-badge', 
                isImage: true, 
                url: "https://minecraft.wiki/images/Invicon_End_Crystal.gif?8decb" 
            }, 
            'Mace': { icon: '💣', class: 'mace-icon-badge' }, 
            'SMP': { 
                icon: '❤️', 
                class: 'smp-icon-badge', 
                isImage: true, 
                url: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/f/f6/Ender_Pearl_JE3_BE2.png/revision/latest?cb=20200512195721" 
            }, 
        };

        const tierListBody = document.getElementById('tier-list-body');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const tierRows = document.querySelectorAll('.tier-row');
        const rankingsLink = document.getElementById('rankings-link');

        function getTierScore(tierString) {
            return TIER_RANKING[tierString] || TIER_RANKING['Default'];
        }

        function getPlayerScoreInMode(row, mode) {
            const tiersData = row.getAttribute('data-mode-tiers');
            const tiers = tiersData.split(',');
            
            if (mode === 'Overall') {
                let maxScore = 0;
                
                tiers.forEach(tierEntry => {
                    const parts = tierEntry.split(':');
                    if (parts.length > 1) {
                         const tier = parts[1];
                         const score = getTierScore(tier);
                         if (score > maxScore) {
                             maxScore = score;
                         }
                    }
                });
                return maxScore; 
            } else {
                for (const tierEntry of tiers) {
                    const [modeName, tier] = tierEntry.split(':');
                    if (modeName === mode) {
                        return getTierScore(tier);
                    }
                }
                return 0; 
            }
        }
        
        function getTierClass(tier) {
            const prefix = tier.substring(0, 2);
            if (prefix === 'HT') return 'tier-ht';
            if (prefix === 'LT') return 'tier-lt';
            return '';
        }

        // Crea el HTML para un badge de Tier
        function createTierBadge(modeName, tier) {
            const iconData = MODE_ICONS[modeName] || { icon: '❓', class: '' };
            const tierClass = getTierClass(tier);

            const item = document.createElement('div');
            item.className = `tier-item-badge ${tierClass}`;
            item.setAttribute('data-mode-name', modeName);
            
            let iconHTML;
            if (iconData.isImage && iconData.url) {
                // Si es una imagen/GIF
                 iconHTML = `<img src="${iconData.url}" alt="${modeName} Icon" class="image-icon-img">`;
            } else {
                // Si es un emoji 
                iconHTML = `<span class="mode-icon ${iconData.class}">${iconData.icon}</span>`;
            }

            // La etiqueta del tier se coloca dentro del badge
            item.innerHTML = `
                <div class="icon-circle">${iconHTML}</div>
                <span class="tier-label">${tier}</span>
            `;
            return item;
        }


        function filterAndSort(selectedMode) {
            
            modeButtons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`[data-mode="${selectedMode}"]`);
            if (activeBtn) {
                 activeBtn.classList.add('active');
            }


            let activeRows = [];
            let currentRank = 1;

            tierRows.forEach(row => {
                const tiersData = row.getAttribute('data-mode-tiers');
                const score = getPlayerScoreInMode(row, selectedMode);
                // Si es Overall, la relevancia es si tiene algún score > 0.
                // Si es un modo específico, la relevancia es si tiene el modo en data-mode-tiers Y score > 0.
                const isRelevant = selectedMode === 'Overall' ? (score > 0) : tiersData.includes(selectedMode) && score > 0;


                if (isRelevant) {
                    row.classList.remove('hidden');
                    activeRows.push({
                        element: row,
                        score: score
                    });
                } else {
                    row.classList.add('hidden');
                }
                
                // --- Actualización de Tiers en la Fila ---
                const tiersListDiv = row.querySelector('.tiers-list');
                tiersListDiv.innerHTML = ''; 
                
                if (selectedMode !== 'Overall') {
                    // Muestra solo el tier de la modalidad activa
                    const tiers = tiersData.split(',');
                    const modeEntry = tiers.find(e => e.includes(selectedMode));
                    if (modeEntry) {
                        const [modeName, tier] = modeEntry.split(':');
                        if (tier && tier !== 'Default' && getTierScore(tier) > 0) {
                             tiersListDiv.appendChild(createTierBadge(modeName, tier));
                        }
                    }
                } else {
                    // Muestra todos los tiers relevantes para 'Overall', ordenados por score (mejor primero)
                    const tiers = tiersData.split(',').map(entry => {
                        const [modeName, tier] = entry.split(':');
                        return { modeName, tier: tier || 'Default', score: getTierScore(tier) };
                    });

                    const relevantTiers = tiers
                        .filter(e => e.score > 0)
                        .sort((a, b) => b.score - a.score); 

                    relevantTiers.forEach(entry => {
                        tiersListDiv.appendChild(createTierBadge(entry.modeName, entry.tier));
                    });
                }
            });

            // Ordena de forma descendente (el score más alto va primero)
            activeRows.sort((a, b) => b.score - a.score);

            activeRows.forEach(item => {
                const row = item.element;
                
                let rankVisualElement = row.querySelector('.rank-number');
                if (!rankVisualElement) {
                    rankVisualElement = row.querySelector('.rank-badge');
                }
                rankVisualElement.textContent = currentRank;
                
                // Aplica clases de color 
                row.classList.remove('rank-1', 'rank-2', 'rank-3');
                if (currentRank === 1) row.classList.add('rank-1');
                if (currentRank === 2) row.classList.add('rank-2');
                if (currentRank === 3) row.classList.add('rank-3');
                
                tierListBody.appendChild(row);
                currentRank++;
            });
            
            document.querySelector('h2').textContent = `SA | Tier List (${selectedMode})`;
        }
        
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                const mode = button.getAttribute('data-mode');
                filterAndSort(mode);
            });
        });

        rankingsLink.addEventListener('click', (e) => {
            e.preventDefault();
            filterAndSort('Overall');
            // Quitamos el alert para un look más profesional
        });

        document.addEventListener('DOMContentLoaded', () => {
            filterAndSort('Overall');
        });
        
    </script>
</body>
</html>
