<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 MCTIERS - SA Rankings Dinámicos</title>
    <style>
        /* Variables y Estilos Globales (Minimalista Oscuro) */
        :root {
            --bg-color: #0d121c; /* Fondo Negro Azulado Muy Oscuro */
            --main-text-color: #e0e0f0;
            --dark-panel-bg: #1c2533; /* Panel principal (Dark Gray Blue) */
            --dark-border: #334054; /* Borde de separación sutil */
            --logo-color: #79d2a4; /* Verde brillante/Lima para el logo y acentos */
            --rank-gold: #fbc02d; 
            --rank-silver: #a0a0a0;
            --rank-bronze: #c67c2d; 
            --tier-high-color-bg: #4e342e; /* HT - Rojo Oscuro/Marrón (Minimalista) */
            --tier-low-color-bg: #2e3b5e;  /* LT - Azul Oscuro (Minimalista) */
            --tier-label-text: #fff;
            --hover-color: #243040; /* Color de hover para filas */
            --active-mode-border: #79d2a4; /* Borde activo (Lima) */
            --player-subtext-color: #999;
            --combat-badge-bg: #2e3b5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* --- Barra de Navegación (Header Minimalista) --- */
        .navbar {
            background-color: var(--dark-panel-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--logo-color);
            letter-spacing: 1px;
            text-shadow: 0 0 3px rgba(121, 210, 164, 0.4); 
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--main-text-color);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .search-input {
            padding: 8px 10px; 
            border-radius: 4px; 
            border: 1px solid var(--dark-border); 
            background: #243040; 
            color: white;
            font-size: 0.9em;
        }

        /* --- Selector de Modos (Minimalista) --- */
        .mode-bar {
            background-color: var(--bg-color); 
            padding: 15px 0; 
            margin-top: 20px;
            display: flex;
            gap: 15px; 
            overflow-x: auto;
            justify-content: flex-start;
            border-bottom: 1px solid var(--dark-border);
            margin-bottom: 20px;
        }

        .mode-btn {
            background-color: transparent; 
            color: #999;
            border: none;
            padding: 10px 0;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.2s, border-bottom 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        /* Icono Wrapper en la barra de modos */
        .mode-btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--dark-panel-bg);
            border: 1px solid transparent;
            overflow: hidden;
            font-size: 1.5em; /* Tamaño para emojis */
            padding: 4px;
        }

        /* Estilos de Botón Activo */
        .mode-btn.active {
            color: var(--active-mode-border); 
            border-bottom: 3px solid var(--active-mode-border); 
            padding-bottom: 7px;
        }

        .mode-btn.active .mode-btn-icon {
            border: 1px solid var(--active-mode-border);
            box-shadow: 0 0 5px rgba(121, 210, 164, 0.5);
        }

        /* --- Tabla de la Tier List --- */
        .tier-table {
            background-color: var(--dark-panel-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--dark-border);
        }

        .tier-header, .tier-row {
            display: grid;
            /* Columnas ajustadas para ser más compactas: Rank (50px), Player (2.2fr), Region (60px), Tiers (3fr) */
            grid-template-columns: 50px 2.2fr 60px 3fr; 
            padding: 15px 20px;
            align-items: center;
            border-bottom: 1px solid var(--dark-border);
            font-size: 0.95em;
            transition: background-color 0.2s, transform 0.2s;
            cursor: default; /* Ya no es clickeable para abrir un modal */
        }
        
        .tier-row:hover {
            background-color: var(--hover-color);
            transform: translateY(-1px); /* Efecto sutil de hover */
        }
        
        .tier-header {
            background-color: #243040; 
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
            color: #ccc;
            letter-spacing: 0.5px;
            padding: 12px 20px;
            border-bottom: 2px solid var(--dark-border);
        }

        /* Rank Badge Style */
        .rank-badge {
            font-weight: 700;
        }
        
        .rank-number {
            min-width: 40px; 
            text-align: center;
            padding: 5px 0; /* Más minimalista, sin fondo cuadrado por defecto */
            line-height: 1;
            font-size: 1.1em;
        }
        
        /* Colores de Top Ranks con fondo para destacar */
        .rank-1 .rank-number { 
            background-color: var(--rank-gold); 
            color: #333; 
            border-radius: 4px;
        }
        .rank-2 .rank-number { 
            background-color: var(--rank-silver); 
            color: #333; 
            border-radius: 4px;
        }
        .rank-3 .rank-number { 
            background-color: var(--rank-bronze); 
            color: #fff; 
            border-radius: 4px;
        }
        
        /* Estilos para el nombre de jugador y subtexto */
        .player-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px; 
            font-weight: 600;
            line-height: 1.2;
        }
        
        .player-name-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-subtext {
            font-size: 0.75em;
            font-weight: 500;
            color: var(--player-subtext-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .combat-badge {
            background-color: var(--combat-badge-bg);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1em;
        }
        
        .skin-icon {
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            border: 2px solid var(--logo-color); 
            object-fit: cover;
        }

        /* Tiers List en la Tabla (Minimalista) */
        .tiers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px; /* Espacio entre badges */
            justify-content: flex-start; 
        }

        .tier-item-badge {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 2px; 
            padding: 5px 0;
        }
        
        .icon-circle {
            width: 25px; /* Más pequeño y minimalista */
            height: 25px;
            border-radius: 50%;
            background-color: #343460; 
            border: 1px solid #4e5e7e; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }
        
        .image-icon-img {
            width: 90%; 
            height: 90%; 
            object-fit: contain; /* Asegura que la imagen se vea completa */
            display: block; 
        }
        
        .tier-label {
            font-size: 0.65em; 
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 2px;
            color: var(--tier-label-text); 
            min-width: 30px; 
            text-align: center;
        }
        
        .tier-ht .tier-label { background-color: var(--tier-high-color-bg); } 
        .tier-lt .tier-label { background-color: var(--tier-low-color-bg); }  

    </style>
</head>

    <script>
        // --- CONFIGURACIÓN DE DATOS ---
        const TIER_RANKING = {
            // Se utiliza para ordenar: HT1 es 12, LT5 es 3, etc.
            'HT1': 12, 'LT1': 11, 'HT2': 10, 'LT2': 9,
            'HT3': 8, 'LT3': 7, 'HT4': 6, 'LT4': 5,
            'HT5': 4, 'LT5': 3, 'Default': 1
        };
        
        // PUNTOS de ejemplo (Se usan solo para simular la clasificación de "Overall")
        // No se muestran, pero permiten ordenar correctamente.
        const TIER_POINTS = {
            'HT1': 600, 'LT1': 540, 'HT2': 480, 'LT2': 420,
            'HT3': 360, 'LT3': 300, 'HT4': 240, 'LT4': 180,
            'HT5': 120, 'LT5': 60, 'Default': 0
        };

        const MODE_ICONS = {
            'Overall': { icon: '🏆', class: 'overall-icon-badge' },
            'Sword': { icon: '⚔️', class: 'sword-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Wooden_Sword_JE2_BE2.png?065ee&format=original" },
            'NetPot': { icon: '🧪', class: 'netpot-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Brewing_Stand.png?26027" },
            'CristalPvP': { icon: '💎', class: 'cristal-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Invicon_End_Crystal.gif?8decb" },
            'Mace': { icon: '🔨', class: 'mace-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Mace.png?1e793" },
            'SMP': { icon: '❤️', class: 'smp-icon-badge', isImage: true, url: "https://minecraft.wiki/images/Heart_%28full%29.png?f47c9" },
        };

        // --- LÓGICA PRINCIPAL ---
        const tierListBody = document.getElementById('tier-list-body');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const tierRows = document.querySelectorAll('.tier-row');
        
        function getTierScore(tierString) {
            return TIER_RANKING[tierString] || TIER_RANKING['Default'];
        }
        
        // Calcula el puntaje total del jugador (para ordenar por "Overall")
        function calculateOverallPoints(tiersData) {
            const tiers = tiersData.split(',');
            let totalPoints = 0;
            tiers.forEach(tierEntry => {
                const parts = tierEntry.split(':');
                if (parts.length > 1) {
                     const tier = parts[1];
                     totalPoints += TIER_POINTS[tier] || TIER_POINTS['Default'];
                }
            });
            return totalPoints;
        }
        
        function getTierClass(tier) {
            const prefix = tier.substring(0, 2);
            if (prefix === 'HT') return 'tier-ht';
            if (prefix === 'LT') return 'tier-lt';
            return '';
        }

        // Crea el HTML para un badge de Tier
        function createTierBadge(modeName, tier) {
            const iconData = MODE_ICONS[modeName] || { icon: '❓', class: '' };
            const tierClass = getTierClass(tier);

            const item = document.createElement('div');
            item.className = `tier-item-badge ${tierClass}`;
            
            let iconHTML;
            if (iconData.isImage && iconData.url) {
                // Si es una imagen/GIF
                 iconHTML = `<img src="${iconData.url}" alt="${modeName} Icon" class="image-icon-img">`;
            } else {
                // Si es un emoji 
                iconHTML = `<span class="mode-icon">${iconData.icon}</span>`;
            }

            item.innerHTML = `
                <div class="icon-circle">${iconHTML}</div>
                <span class="tier-label">${tier}</span>
            `;
            return item;
        }

        function filterAndSort(selectedMode) {
            
            modeButtons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`[data-mode="${selectedMode}"]`);
            if (activeBtn) {
                 activeBtn.classList.add('active');
            }

            let activeRows = [];
            
            tierRows.forEach(row => {
                const tiersData = row.getAttribute('data-mode-tiers');
                const points = calculateOverallPoints(tiersData);

                // Determina la relevancia y el score para la ordenación
                let sortScore = 0;
                let isRelevant = false;

                if (selectedMode === 'Overall') {
                    sortScore = points; // Ordenamos por puntos totales simulados
                    isRelevant = points > 0;
                } else {
                    const tiers = tiersData.split(',');
                    const modeEntry = tiers.find(e => e.includes(selectedMode));
                    if (modeEntry) {
                        const [, tier] = modeEntry.split(':');
                        sortScore = getTierScore(tier); // Ordenamos por rank del modo específico
                        isRelevant = sortScore > 0;
                    }
                }
                
                if (isRelevant) {
                    row.classList.remove('hidden');
                    activeRows.push({
                        element: row,
                        score: sortScore 
                    });
                } else {
                    row.classList.add('hidden');
                }
                
                // --- Actualización de Tiers en la Fila ---
                const tiersListDiv = row.querySelector('.tiers-list');
                tiersListDiv.innerHTML = ''; 
                
                if (selectedMode !== 'Overall') {
                    // Muestra solo el tier de la modalidad activa
                    const tiers = tiersData.split(',');
                    const modeEntry = tiers.find(e => e.includes(selectedMode));
                    if (modeEntry) {
                        const [modeName, tier] = modeEntry.split(':');
                        if (tier && getTierScore(tier) > 0) {
                             tiersListDiv.appendChild(createTierBadge(modeName, tier));
                        }
                    }
                } else {
                    // Muestra todos los tiers, ordenados por score (mejor primero)
                    const tiers = tiersData.split(',').map(entry => {
                        const [modeName, tier] = entry.split(':');
                        return { modeName, tier: tier || 'Default', score: getTierScore(tier) };
                    });

                    const relevantTiers = tiers
                        .filter(e => e.score > 0)
                        .sort((a, b) => b.score - a.score); 

                    relevantTiers.forEach(entry => {
                        tiersListDiv.appendChild(createTierBadge(entry.modeName, entry.tier));
                    });
                }
            });

            // Ordena de forma descendente (el score/puntos más alto va primero)
            activeRows.sort((a, b) => b.score - a.score);

            let currentRank = 1;
            activeRows.forEach(item => {
                const row = item.element;
                
                let rankVisualElement = row.querySelector('.rank-number');
                rankVisualElement.textContent = `${currentRank}.`;
                
                row.classList.remove('rank-1', 'rank-2', 'rank-3');
                if (currentRank === 1) row.classList.add('rank-1');
                if (currentRank === 2) row.classList.add('rank-2');
                if (currentRank === 3) row.classList.add('rank-3');
                
                tierListBody.appendChild(row);
                currentRank++;
            });
        }
        
        modeButtons.forEach(button => {
            button.addEventListener('click', () => {
                const mode = button.getAttribute('data-mode');
                filterAndSort(mode);
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            filterAndSort('Overall'); 
        });
        
    </script>
</body>
</html>
