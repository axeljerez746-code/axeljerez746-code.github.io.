<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 ZenMC Tiers - SA Rankings Dinámicos</title>
    <style>
        /* Variables y Estilos Generales */
        :root {
            --bg-color: #1a1a2e; /* Morado Oscuro/Casi Negro */
            --main-text-color: #f0f0f0;
            --dark-panel-bg: #2b2b4d; /* Morado Medio */
            --dark-border: #444473; /* Morado Grisáceo para bordes */
            --logo-color: #d1b4ff; /* Morado Claro/Lila para el logo */
            --rank-gold: #ffc107; /* Mantenemos el oro para el #1 */
            --tier-high-color-bg: #b03a8d; /* Morado/Rojo Oscuro para HT */
            --tier-low-color-bg: #8e44ad;  /* Morado Intenso para LT */
            --tier-label-text: #fff;
            --icon-circle-border: #d1b4ff; /* Borde de ícono lila */
            --active-mode-btn: #8e44ad; /* Morado de botón activo */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Contenedor de decoración */
        .decoration-banner {
            text-align: center;
            margin-bottom: 20px;
        }

        /* --- Barra de Navegación (Header) --- */
        .navbar {
            background-color: var(--dark-panel-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--logo-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--main-text-color);
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        #discord-link {
            color: #d1b4ff; /* Lila */
        }

        .nav-links a:hover {
            background-color: #444473;
        }

        /* --- Selector de Modos (Barra de botones) --- */
        .mode-bar {
            background-color: var(--dark-panel-bg);
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            justify-content: flex-start;
        }

        .mode-btn {
            background-color: #3b3b6b; /* Un tono más oscuro que el panel */
            color: var(--main-text-color);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
